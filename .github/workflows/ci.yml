name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: el workflow solo necesita leer el código.
permissions:
  contents: read

jobs:
  verificar:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y formato (Biome)
        run: npx biome ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
